name: PhoneLab CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build, tests and publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SoftBox.PhoneLab.sln
      - name: Unit tests
        run: dotnet test SoftBox.PhoneLab.sln --no-restore --configuration Release
      - name: Publish self-contained Windows x64
        run: >
          dotnet publish src/SoftBox.PhoneLab.Desktop/SoftBox.PhoneLab.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/PhoneLab-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SoftBox-PhoneLab-Windows-x64
          path: artifacts/PhoneLab-win-x64/
          if-no-files-found: error
          retention-days: 30

  android-agent:
    name: Android Agent APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Assemble debug APK
        working-directory: agent
        run: gradle :app:assembleDebug
      - name: Upload Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: SoftBox-PhoneLab-Android-Agent-debug
          path: agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
